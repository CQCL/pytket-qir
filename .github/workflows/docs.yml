name: Run doc build and create artifact

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "runci/**"
  schedule:
    # 04:00 every Tuesday morning
    - cron: "0 4 * * 2"

jobs:
  check-docs:
    name: Build docs and create artefact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Prepare docs configuration
        run: |
          cp -R docs/pytket-docs-theming/_static docs
          cp docs/pytket-docs-theming/conf.py docs
          cp docs/pytket-docs-theming/pyproject.toml docs
          cp docs/pytket-docs-theming/uv.lock docs
      - name: Install docs dependencies
        # Use the upstream pkg_resources fix until googleanalytics releases it:
        # https://github.com/sphinx-contrib/googleanalytics/pull/22
        run: >-
          uv add --directory docs --python 3.12
          'sphinxcontrib-googleanalytics @ git+https://github.com/sphinx-contrib/googleanalytics@4ae0adf4e9b8a0fd0f97dc90ffdf2e7e49c4c13e'
          'setuptools>=83' 'certifi>=2026.10.19' 'filelock>=4.2.1'
      - name: Build docs
        working-directory: docs
        run: |
          uv run --python 3.12 --with-editable .. sphinx-build -b html . build -D html_title=pytket-qir
          uv run --python 3.12 --with-editable .. sphinx-build -b linkcheck . build
          uv run --python 3.12 --with-editable .. sphinx-build -v -b coverage . build/coverage
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/build/
